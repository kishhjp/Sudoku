<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sudoku</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<meta name="theme-color" content="#F5F7FC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
*{-webkit-touch-callout:none}
html{background:var(--paper);overscroll-behavior:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0;overscroll-behavior:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<script>
try{var _s=JSON.parse(localStorage.getItem('tss.settings')||'{}');document.documentElement.dataset.sk=_s.theme||'light';}catch(e){document.documentElement.dataset.sk='light';}
</script>
<style>
/* Layout concept: a clean puzzle-app screen. Score and status on top, a full-width board, labelled icon tools, then a large number pad. */
:root{
  --paper:#F5F7FC;--surface:#FFFFFF;--sunk:#E9EDF5;
  --ink:#2B3A55;--ink2:#5F6E86;--ink3:#7E889C;--line:#DADFE8;--heavy:#98A1B2;
  --accent:#2A5BC4;--accent-ink:#FFFFFF;--seal:#2A5BC4;--seal-ink:#FFFFFF;--bad:#D92D45;--user:#2A5BC4;
  --sel:#A9C4FA;--peer:rgba(60,80,130,.09);--same:#8FB3F9;--same-ink:#14233F;--area:rgba(42,91,196,.12);--shadow:0 1px 4px rgba(30,50,90,.16);
  --k1:#F7C4BB;--k2:#FBD6A8;--k3:#F8EC96;--k4:#C2EAB4;--k5:#AEE6DD;--k6:#BAD5FA;--k7:#D7C9F8;--k8:#F6C2E0;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
:root[data-sk="dark"]{
  --paper:#000000;--surface:#14161B;--sunk:#262A32;
  --ink:#F2F4F8;--ink2:#A9B1BF;--ink3:#868E9D;--line:#2B2F37;--heavy:#6C7483;
  --accent:#4C82F0;--accent-ink:#FFFFFF;--seal:#4C82F0;--seal-ink:#FFFFFF;--bad:#FF6B6B;--user:#8FB6FF;
  --sel:#2F4F91;--peer:rgba(255,255,255,.09);--same:#2F5AB0;--same-ink:#FFFFFF;--area:rgba(76,130,240,.2);--shadow:none;
  --k1:#6E2D2A;--k2:#70471F;--k3:#665A1A;--k4:#2D5A32;--k5:#1D5956;--k6:#244A82;--k7:#4B3A83;--k8:#6F2E5F;
  color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-sk="system"]{
  --paper:#000000;--surface:#14161B;--sunk:#262A32;
  --ink:#F2F4F8;--ink2:#A9B1BF;--ink3:#868E9D;--line:#2B2F37;--heavy:#6C7483;
  --accent:#4C82F0;--accent-ink:#FFFFFF;--seal:#4C82F0;--seal-ink:#FFFFFF;--bad:#FF6B6B;--user:#8FB6FF;
  --sel:#2F4F91;--peer:rgba(255,255,255,.09);--same:#2F5AB0;--same-ink:#FFFFFF;--area:rgba(76,130,240,.2);--shadow:none;
  --k1:#6E2D2A;--k2:#70471F;--k3:#665A1A;--k4:#2D5A32;--k5:#1D5956;--k6:#244A82;--k7:#4B3A83;--k8:#6F2E5F;
  color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px;padding-block:0 12px;border-bottom:1.5px solid var(--heavy);margin-bottom:20px}
.brand{font-family:var(--display);font-size:1.25rem;background:none;border:0;padding:0;display:flex;align-items:center;gap:8px;line-height:1.2}
.brand i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--seal);color:var(--seal-ink);font-size:.82rem;transform:rotate(-9deg)}
nav{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-left:auto}
.navb{background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:7px 12px;font-weight:700;font-size:.88rem;min-height:40px}
.navb[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.save{flex-basis:100%;font-size:.76rem;color:var(--ink3);min-height:1.2em;order:3}
.ingame .top{display:none}
.ingame.wrap{padding-block:8px 16px}
h1,h2{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.08}
h2{font-size:1.35rem;line-height:1.2}
.lede{color:var(--ink2);max-width:58ch;margin:8px 0 0}
.lede b{color:var(--ink)}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.home{display:grid;gap:22px}
.btn{background:var(--surface);border:1.5px solid var(--heavy);padding:9px 14px;font-weight:700;border-radius:6px;min-height:44px}
.btn.main{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
.btn:active,.tool:active,.key:active,.navb:active{transform:scale(.97)}
.card{background:var(--surface);border:1.5px solid var(--heavy);border-radius:8px}
.scoretop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 24px;align-items:center;padding:16px 18px}
.bignum{font-family:var(--display);font-size:clamp(2.4rem,9vw,3.4rem);line-height:1;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 118px;gap:8px 22px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .nm{font-family:var(--display);font-size:1.4rem;line-height:1.15}
.row .ds{color:var(--ink2);font-size:.86rem}
.row.locked .nm,.row.locked .ds{color:var(--ink3)}
.row .act{justify-self:end}
.lockmsg{font-size:.8rem;color:var(--ink3);text-align:right;line-height:1.25}
.stamps{display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.st{width:40px;height:40px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-size:1.1rem}
.st.on{border:0;background:var(--seal);color:var(--seal-ink)}
.stamps .st.on:nth-child(1){transform:rotate(-11deg)}.stamps .st.on:nth-child(2){transform:rotate(6deg)}.stamps .st.on:nth-child(3){transform:rotate(-4deg)}
.more{font-size:.82rem;font-weight:700}
.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{padding:15px 18px;display:grid;gap:7px;align-content:start}
.tile .nm{font-family:var(--display);font-size:1.4rem;line-height:1.15}
.tile .ds{color:var(--ink2);font-size:.86rem}
.tile .bot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.tile .fig{font-size:.84rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.prog{display:grid;gap:8px}
.progrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.progrow .nm{font-weight:700}
.progrow .fig{color:var(--ink2);font-size:.86rem;font-variant-numeric:tabular-nums}
.progrow .btn{margin-left:auto}

.game{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:22px;align-items:start}
.bcol{min-width:0;display:grid;gap:8px;justify-items:center}
.ghead{width:100%;display:flex;align-items:center;gap:6px 12px}
.ghead h2{margin-right:auto;min-width:0}
.pill{border:1.5px solid var(--line);border-radius:6px;padding:3px 9px;font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem;white-space:nowrap}
.pill.warn{border-color:var(--bad);color:var(--bad)}
.best{font-size:.82rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.bbox{container-type:inline-size;width:min(100%,max(260px,calc(100vh - var(--chrome,120px))),var(--maxb,660px));width:min(100%,max(260px,calc(100dvh - var(--chrome,120px))),var(--maxb,660px));max-width:100%}
.bbox.zoom{overflow:auto;-webkit-overflow-scrolling:touch;aspect-ratio:1;border:2.5px solid var(--heavy)}
.bbox.zoom .board{--z:1.8;border:0;touch-action:pan-x pan-y}
.board{--n:9;position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));width:calc(100%*var(--z,1));aspect-ratio:1;height:calc(100cqw*var(--z,1));border:2.5px solid var(--heavy);background:var(--surface);container-type:inline-size;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.board.ro{touch-action:auto}
.cell{contain:size layout paint;position:relative;display:grid;place-items:center;min-width:0;min-height:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:calc(92vw/var(--n)*.56);font-size:calc(100cqw/var(--n)*.6);line-height:1;cursor:pointer;overflow:hidden}
.board.ro .cell{cursor:default}
.cell.br{border-right:2.5px solid var(--heavy)}
.cell.bb{border-bottom:2.5px solid var(--heavy)}
.cell.er{border-right:0}.cell.eb{border-bottom:0}
.cell::after{content:"";position:absolute;inset:0;pointer-events:none}
.cell.peer::after{background:var(--peer)}
.cell.same::after{background:var(--same)}
.cell.sel::after{background:var(--sel)}
.cell.primary::after{background:var(--sel);box-shadow:inset 0 0 0 2px var(--ink)}
.cell.touched::after{box-shadow:inset 0 0 0 2.5px var(--ink)}
.cell>span{position:relative;z-index:1}
.v-given{font-weight:900;color:var(--ink)}
.v-user{font-weight:400;color:var(--user)}
.cell.wrong .v-user{color:var(--bad);font-weight:700}
.v-sol{color:var(--ink3);font-weight:400}
.notes{position:absolute;inset:6%;z-index:1;display:grid;grid-template-columns:repeat(var(--nc),1fr);grid-auto-rows:1fr;font-size:calc(92vw/var(--n)/var(--nc)*.8);font-size:calc(100cqw/var(--n)/var(--nc)*.86);color:var(--ink2);font-weight:500;line-height:1}
.notes b{display:grid;place-items:center;font-weight:inherit}
.notes b.hit{color:var(--ink);font-weight:900}
.board.paused .cell>span,.board.paused .notes{visibility:hidden}
.pausemsg{position:absolute;inset:0;z-index:3;display:grid;place-items:center;text-align:center;background:var(--surface);padding:16px;gap:10px;align-content:center}
.pcol{display:grid;gap:12px;min-width:0}
.keys{display:grid;gap:6px;grid-template-columns:repeat(var(--kc,3),minmax(0,1fr))}
.key{background:var(--surface);border:1.5px solid var(--heavy);border-radius:6px;padding:6px 0 3px;display:grid;justify-items:center;line-height:1.1;min-height:58px;align-content:center}
.key .s{font-size:1.45rem;font-weight:700}
.key .r{font-size:.68rem;color:var(--ink3);font-variant-numeric:tabular-nums;min-height:1em}
.key.done{opacity:.3}
.notesmode .key .s{font-weight:400}
.tools{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.tool{background:var(--surface);border:1.5px solid var(--heavy);border-radius:6px;padding:9px 2px;font-size:.84rem;font-weight:700;min-height:44px}
.tool[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tool[disabled]{opacity:.35;cursor:default}
.tool.soft{border-color:var(--line)}
.colours{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.sw{height:34px;border:1.5px solid var(--heavy);border-radius:6px;padding:0;min-width:0;background:var(--c,transparent)}
.sw.none{background:linear-gradient(135deg,transparent 46%,var(--ink) 46%,var(--ink) 54%,transparent 54%)}
.k1{background:var(--k1)}.k2{background:var(--k2)}.k3{background:var(--k3)}.k4{background:var(--k4)}.k5{background:var(--k5)}.k6{background:var(--k6)}.k7{background:var(--k7)}.k8{background:var(--k8)}
.section{display:grid;gap:6px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1.5px solid var(--line);padding:5px 11px;border-radius:6px;font-size:.84rem;font-weight:700;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hist{display:grid;gap:0;overflow:hidden}
.hrow{display:grid;grid-template-columns:42px minmax(0,1.3fr) 70px 70px 64px;gap:6px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 14px;font-variant-numeric:tabular-nums}
.hrow:last-child{border-bottom:0}
.hrow .nm{font-weight:700;display:block}
.hrow .dt{font-size:.8rem;color:var(--ink2);display:block}
.hhead{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding-block:7px}
.mini{width:32px;height:32px;font-size:.9rem}
.mini.play{border-style:solid;border-color:var(--ink);font-family:var(--body)}
.mini.quit{border-style:solid;border-color:var(--ink3);color:var(--ink3);font-family:var(--body)}
.empty{padding:28px 18px;text-align:center;color:var(--ink2)}
.review{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.trans{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.trans .bts{display:flex;gap:4px}
.trans .tool{padding:6px 10px;min-width:44px}
.trans input{width:100%;accent-color:var(--ink);min-width:0}
.stepn{font-size:.82rem;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.cap{width:100%;min-height:3em;font-size:.92rem;font-weight:500}
.cap time{color:var(--ink3);font-variant-numeric:tabular-nums;margin-right:8px}
.cap .badm{color:var(--bad);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px}
.stats b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{font-size:.76rem;color:var(--ink2)}
.facts{font-size:.86rem;color:var(--ink2);display:grid;gap:3px}
.rbtns{display:flex;gap:8px;flex-wrap:wrap}

.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chartc{padding:14px 16px;display:grid;gap:6px;min-width:0;position:relative}
.chartc svg{width:100%;height:auto;display:block;touch-action:pan-y}
.axis{font:11px var(--body);fill:var(--ink3)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);padding:3px 8px;border-radius:4px;font-size:.78rem;white-space:nowrap;font-variant-numeric:tabular-nums;z-index:2}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
.tbl th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);text-align:right;padding:8px 10px;font-weight:700;white-space:nowrap}
.tbl td{text-align:right;padding:9px 10px;border-top:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-weight:700}
.foot{font-size:.8rem;color:var(--ink2);max-width:70ch}

.over{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.6);padding:16px;overflow:auto}
.dialog{background:var(--surface);border:1.5px solid var(--heavy);border-radius:10px;padding:22px 20px;max-width:400px;width:100%;display:grid;gap:10px;justify-items:center;text-align:center}
.bigstamp{width:92px;height:92px;border-radius:50%;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;font-family:var(--display);font-size:2.6rem;transform:rotate(-10deg);animation:thud .42s cubic-bezier(.2,1.4,.5,1)}
@keyframes thud{from{transform:scale(1.9) rotate(4deg);opacity:0}to{transform:scale(1) rotate(-10deg);opacity:1}}
.dialog .btns{display:grid;gap:8px;width:100%;margin-top:4px}
.dialog p{margin:0;color:var(--ink2);font-size:.92rem}
.dialog p b{color:var(--ink)}
.scoreline{font-family:var(--display);font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
.note{font-size:.88rem;border:1.5px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.setrow{display:flex;gap:10px;align-items:center;text-align:left;width:100%;font-size:.92rem;cursor:pointer;min-height:44px}
.setrow input{width:22px;height:22px;accent-color:var(--ink);flex:none}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:.88rem;z-index:30;max-width:calc(100vw - 32px);text-align:center}
.drawing{font-family:var(--display);font-size:1.3rem}
@media (hover:hover){.btn:hover,.key:hover,.tool:not([disabled]):not([aria-pressed="true"]):hover,.navb:not([aria-current]):hover,.chip:not([aria-pressed="true"]):hover,button.hrow:hover{background:var(--sunk)}.btn.main:hover{background:var(--ink2);border-color:var(--ink2)}}
@media (max-width:880px){
  .game,.review{grid-template-columns:minmax(0,1fr);gap:8px}
  .review{gap:14px}
  .bbox{--chrome:var(--chromem,296px)!important}
  .review .bbox{--chrome:300px!important}
  .pcol{gap:7px}
  .keys{--kc:var(--kcm,9)!important;gap:4px}
  .key{min-height:48px}.key .s{font-size:1.25rem}
  .tools{gap:5px}
  .tool{min-height:42px;padding:6px 2px;font-size:.8rem}
  .colours{gap:4px}.sw{height:30px}
  .charts{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .top{margin-bottom:14px}
  nav{margin-left:0;width:100%}
  .navb{padding:7px 2px}
  .row{grid-template-columns:minmax(0,1fr) auto;padding:11px 14px}
  .row .info{grid-column:1/-1}
  .side{grid-template-columns:minmax(0,1fr)}
  .st{width:36px;height:36px}
  .hhead{display:none}
  .hrow{grid-template-columns:40px minmax(0,1fr) auto;padding:9px 10px}
  .hrow .cm{grid-column:2/-1;font-size:.8rem;color:var(--ink2)}
  .hrow .tm{grid-column:3;grid-row:1}
  .hrow .sc{grid-column:3;grid-row:2;font-weight:700}
  .hrow .cm::after{content:attr(data-l)}
  .tbl .hidem{display:none}
  .tbl table{font-size:.84rem}
  .tbl th{padding:8px 6px;letter-spacing:0;font-size:.66rem}
  .tbl td{padding:8px 6px}
  .scoretop{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.bigstamp{animation:none}.btn:active,.tool:active,.key:active,.navb:active{transform:none}}

h1,h2{font-weight:700}
.bignum,.scoreline{font-weight:700}
.brand{font-size:1.3rem;font-weight:700}
.top{border-bottom:1px solid var(--line)}
.navb{border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.navb[aria-current="page"],.btn.main,.tool[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card{border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.progrow{border:1px solid var(--line);border-radius:12px}
.row .nm,.tile .nm{font-weight:700;font-size:1.15rem}
.st{font-size:1.05rem;font-weight:700;font-family:var(--body)}
.dialog{border:0;border-radius:14px}
.bigstamp{font-family:var(--body)}

<script>
function SudokuEngine(){
  const geos={};
  const SPECS={
    beginner:{N:9,bh:3,bw:3,min:40,max:46,tMin:1,tMax:1,sym:true},
    easy:{N:9,bh:3,bw:3,min:33,max:38,tMin:1,tMax:2,sym:true},
    medium:{N:9,bh:3,bw:3,min:27,max:33,tMin:3,tMax:3,sym:true},
    hard:{N:9,bh:3,bw:3,min:24,max:31,tMin:4,tMax:4,sym:true},
    expert:{N:9,bh:3,bw:3,min:22,max:30,tMin:5,tMax:5,sym:false},
    extreme:{N:9,bh:3,bw:3,min:20,max:28,tMin:6,tMax:6,sym:false},
    fast:{N:6,bh:2,bw:3,min:11,max:15,tMin:1,tMax:2,sym:false},
    giant:{N:16,bh:4,bw:4,min:100,max:124,tMin:1,tMax:3,sym:true,logicOnly:true}
  };
  const TECH=['','Hidden single','Naked single','Locked candidates','Pairs and triples','X-wing, swordfish or Y-wing','Beyond standard techniques'];
  function geo(N,bh,bw){
    const k=N+'-'+bh+'-'+bw; if(geos[k])return geos[k];
    const n=N*N,units=[],unitsOf=Array.from({length:n},()=>[]),peers=[],box=new Int16Array(n);
    for(let r=0;r<N;r++){const u=[];for(let c=0;c<N;c++)u.push(r*N+c);units.push(u);}
    for(let c=0;c<N;c++){const u=[];for(let r=0;r<N;r++)u.push(r*N+c);units.push(u);}
    const bpr=N/bw; // boxes per row of boxes
    for(let b=0;b<N;b++){const u=[],r0=Math.floor(b/bpr)*bh,c0=(b%bpr)*bw;
      for(let r=0;r<bh;r++)for(let c=0;c<bw;c++){u.push((r0+r)*N+c0+c);box[(r0+r)*N+c0+c]=b;}
      units.push(u);}
    units.forEach((u,i)=>u.forEach(x=>unitsOf[x].push(i)));
    const isPeer=new Uint8Array(n*n);
    for(let i=0;i<n;i++){const s=new Set();unitsOf[i].forEach(ui=>units[ui].forEach(x=>{if(x!==i)s.add(x);}));
      peers.push([...s]);s.forEach(x=>{isPeer[i*n+x]=1;});}
    return geos[k]={N,bh,bw,n,units,unitsOf,peers,box,isPeer,all:(N===32?-1:(1<<N)-1)};
  }
  const pc=x=>{let c=0;while(x){x&=x-1;c++;}return c;};
  const low=x=>31-Math.clz32(x&-x);
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function masks(p,g){
    const N=g.N,R=new Int32Array(N),C=new Int32Array(N),B=new Int32Array(N);
    for(let i=0;i<g.n;i++){if(p[i]){const b=1<<(p[i]-1);R[Math.floor(i/N)]|=b;C[i%N]|=b;B[g.box[i]]|=b;}}
    return{R,C,B};
  }
  function countSol(p0,g,limit){
    const p=Int8Array.from(p0),N=g.N,{R,C,B}=masks(p,g),empt=[];
    for(let i=0;i<g.n;i++)if(!p[i])empt.push(i);
    let count=0;
    function rec(k){
      if(k===empt.length){count++;return;}
      let best=-1,bm=0,bc=99;
      for(let j=k;j<empt.length;j++){
        const i=empt[j],m=g.all&~(R[Math.floor(i/N)]|C[i%N]|B[g.box[i]]),cn=pc(m);
        if(cn<bc){bc=cn;best=j;bm=m;if(cn<=1)break;}
      }
      if(bc===0)return;
      const t=empt[k];empt[k]=empt[best];empt[best]=t;
      const i=empt[k],r=Math.floor(i/N),c=i%N,b=g.box[i];
      while(bm&&count<limit){const bit=bm&-bm;bm^=bit;
        R[r]|=bit;C[c]|=bit;B[b]|=bit;rec(k+1);R[r]^=bit;C[c]^=bit;B[b]^=bit;}
      empt[best]=empt[k];empt[k]=t;
    }
    rec(0);
    return count;
  }
  function fill(g){
    const N=g.N;
    for(let attempt=0;attempt<200;attempt++){
      const p=new Int8Array(g.n),R=new Int32Array(N),C=new Int32Array(N),B=new Int32Array(N),empt=[];
      for(let i=0;i<g.n;i++)empt.push(i);
      shuffle(empt);
      let nodes=0,limit=N>9?30000:200000;
      const rec=k=>{
        if(k===empt.length)return true;
        if(++nodes>limit)return false;
        let best=-1,bm=0,bc=99;
        for(let j=k;j<empt.length;j++){
          const i=empt[j],m=g.all&~(R[Math.floor(i/N)]|C[i%N]|B[g.box[i]]),cn=pc(m);
          if(cn<bc){bc=cn;best=j;bm=m;if(cn<=1)break;}
        }
        if(bc===0)return false;
        const t=empt[k];empt[k]=empt[best];empt[best]=t;
        const i=empt[k],r=Math.floor(i/N),c=i%N,b=g.box[i],opts=[];
        while(bm){const bit=bm&-bm;bm^=bit;opts.push(bit);}
        shuffle(opts);
        for(const bit of opts){R[r]|=bit;C[c]|=bit;B[b]|=bit;p[i]=low(bit)+1;
          if(rec(k+1))return true;
          R[r]^=bit;C[c]^=bit;B[b]^=bit;p[i]=0;}
        empt[best]=empt[k];empt[k]=t;
        return false;
      };
      if(rec(0))return p;
    }
    throw new Error('fill failed');
  }
  function grade(p0,g,maxTier){
    const N=g.N,n=g.n,val=Int8Array.from(p0),cand=new Int32Array(n);
    let left=0,tier=1,c3=0,c4=0,c5=0;
    const{R,C,B}=masks(val,g);
    for(let i=0;i<n;i++)if(!val[i]){left++;cand[i]=g.all&~(R[Math.floor(i/N)]|C[i%N]|B[g.box[i]]);}
    const place=(i,bit)=>{val[i]=low(bit)+1;cand[i]=0;left--;const ps=g.peers[i];for(let k=0;k<ps.length;k++)cand[ps[k]]&=~bit;};
    const units=g.units;
    function hiddenSingle(){
      let did=false;
      for(const u of units){
        let once=0,twice=0;
        for(let k=0;k<N;k++){const m=cand[u[k]];twice|=once&m;once|=m;}
        let s=once&~twice;
        while(s){const bit=s&-s;s^=bit;
          for(let k=0;k<N;k++)if(cand[u[k]]&bit){place(u[k],bit);did=true;break;}
        }
      }
      return did;
    }
    function nakedSingle(){
      for(let i=0;i<n;i++){const m=cand[i];if(m&&!(m&(m-1))){place(i,m);return true;}}
      return false;
    }
    function locked(){
      for(let ui=0;ui<units.length;ui++){const u=units[ui];
        for(let d=0;d<N;d++){const bit=1<<d,pos=[];
          for(let k=0;k<N;k++)if(cand[u[k]]&bit)pos.push(u[k]);
          if(pos.length<2||pos.length>Math.max(g.bh,g.bw))continue;
          for(const vi of g.unitsOf[pos[0]]){
            if(vi===ui)continue;
            if(!pos.every(x=>g.unitsOf[x].includes(vi)))continue;
            let did=false;
            for(const x of units[vi])if(!pos.includes(x)&&(cand[x]&bit)){cand[x]&=~bit;did=true;}
            if(did)return true;
          }
        }
      }
      return false;
    }
    function subsets(k){
      for(const u of units){
        const cells=u.filter(x=>cand[x]);
        if(cells.length<=k)continue;
        // naked
        const nk=cells.filter(x=>pc(cand[x])<=k);
        let hit=false;
        const walk=(start,chosen,mask)=>{

            return;
          }
          for(let j=start;j<nk.length&&!hit;j++)walk(j+1,chosen.concat(nk[j]),mask|cand[nk[j]]);
        };
        walk(0,[],0);
        if(hit)return true;
        // hidden
        let present=0;cells.forEach(x=>present|=cand[x]);
        const ds=[];for(let d=0;d<N;d++)if(present&(1<<d))ds.push(1<<d);
        const walk2=(start,cnt,mask)=>{
          if(hit)return;
          if(cnt===k){
            const inn=cells.filter(x=>cand[x]&mask);
            if(inn.length!==k)return;
            for(const x of inn)if(cand[x]&~mask){cand[x]&=mask;hit=true;}
            return;
          }
          for(let j=start;j<ds.length&&!hit;j++)walk2(j+1,cnt+1,mask|ds[j]);
        };

      }

    }
    function fish(k){
      for(let orient=0;orient<2;orient++){
        const base=orient?N:0,other=orient?0:N;
        for(let d=0;d<N;d++){const bit=1<<d,lines=[];
          for(let l=0;l<N;l++){const u=units[base+l];let m=0;
            for(let j=0;j<N;j++)if(cand[u[j]]&bit)m|=1<<j;
            const cn=pc(m);if(cn>=2&&cn<=k)lines.push([l,m]);}

            if(ch.length===k){

              for(let j=0;j<N;j++)if(mask&(1<<j)){const cross=units[other+j];

      if(maxTier>=4&&(subsets(2)||subsets(3))){tier=Math.max(tier,4);c4++;continue;}

      return{solved:false,tier:maxTier>=5?6:99,c3,c4,c5,left};

  }

    const sol=fill(g),p=Int8Array.from(sol),n=g.n;

      const j=n-1-i;
      if(spec.sym){if(i<=j)groups.push(i===j?[i]:[i,j]);}else groups.push([i]);
    }
    shuffle(groups);
    const target=spec.min+Math.floor(Math.random()*(spec.max-spec.min+1));
    let best=null;
    for(const grp of groups){
      if(clues-grp.length<spec.min)continue;
      const saved=grp.map(x=>p[x]);
      grp.forEach(x=>p[x]=0);
      let gr=null,ok=true;
      if(spec.logicOnly){gr=grade(p,g,spec.tMax);ok=gr.solved;}

      const gr=grade(p,g,spec.logicOnly?spec.tMax:6);

    }
    const gr=grade(p,g,6);

  function generate(mode,seen,budgetMs){
    const spec=SPECS[mode],g=geo(spec.N,spec.bh,spec.bw),t0=Date.now(),seenSet=new Set(seen||[]);

  }
  return{generate,SPECS,TECH,geo,countSol,grade,effort};
}

async function flushCloud(docId,getter){
  if(!cloud.col)return;

  cloud.busy[docId]=true;

  catch(e){
    if(e&&e.code==='quota_exceeded'){setSave('Your account storage for this game is full. New progress stays on this device.');toast(S.saveText);}
    else if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted'))setSave('Saving on this device only.');
  }

}
async function initCloud(){
  setSave('Saved on this device. Connecting to your account…');
  if(!window.claude||!window.claude.use){setSave('Saved on this device.');return;}
  const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  const id=user&&await user.id();
  if(!db||!id){setSave('Saved on this device. Sign in to keep games across devices.');return;}
  cloud.col=db.collection('data/users/'+id);
  const tm=setTimeout(()=>{if(!cloud.ready)setSave('Your saved games can’t be reached yet. New progress is kept on this device.');},10000);
  cloud.col.onSnapshot(snap=>{
    let changed=false;
    snap.docs.forEach(d=>{
      const data=d.data();if(!data)return;
      if(d.id==='settings'){if(!d.metadata.hasPendingWrites&&(data.updatedAt||0)>(S.settings.updatedAt||0)){Object.assign(S.settings,JSON.parse(JSON.stringify(data)));lsSet('settings',S.settings);applyTheme();changed=true;}return;}
      if(!d.id.startsWith('game-'))return;
      const loc=S.games[data.id];
      if(!loc||(data.updatedAt||0)>(loc.updatedAt||0)){
        const copy=JSON.parse(JSON.stringify(data));
        S.games[data.id]=copy;lsSet('g.'+data.id,copy);changed=true;
        if(S.g&&S.g.id===data.id&&S.view==='game'){S.g=copy;S.b=stateAt(copy,copy.moves.length);}
      }
    });
    if(!snap.metadata.fromCache&&!cloud.ready){
      cloud.ready=true;clearTimeout(tm);setSave('Every game is saved to your account.');
      const remote={};snap.docs.forEach(d=>{const x=d.data();if(x)remote[d.id]=x.updatedAt||0;});
      Object.values(S.games).forEach(g=>{if((remote['game-'+g.id]||-1)<(g.updatedAt||0))queueCloud('game-'+g.id,()=>S.games[g.id],true);});
    }
    if(changed)refreshView();
  },err=>{clearTimeout(tm);setSave('Saving on this device only for now.');});
}

function streak(){
  const key=t=>{const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();};
  const days=new Set(wonGames().map(g=>key(g.finishedAt||g.createdAt)));
  let n=0,d=new Date();if(!days.has(key(d)))d.setDate(d.getDate()-1);
  while(days.has(key(d))){n++;d.setDate(d.getDate()-1);}
  return{n,today:days.has(key(new Date()))};
}

/* ---------- state ---------- */
function stateAt(g,step){
  const n=g.size*g.size,b={v:g.puzzle.slice(),n:new Array(n).fill(0),k:new Array(n).fill(0)};
  for(let i=0;i<step;i++)applyCh(b,g.moves[i].ch);
  return b;
}
const F=['v','n','k'];
function applyCh(b,ch){for(const x of ch)b[F[x[1]]][x[0]]=x[3];}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function newGame(mode){
  S.view='drawing';setIngame(false);
  view.innerHTML='<div class="empty drawing">Drawing a new '+META[mode].name+' puzzle…</div>';
  setTimeout(()=>{
    const seen=games().filter(g=>g.mode===mode).map(g=>g.puzzle.join(','));
    const r=E.generate(mode,seen);
    const g={id:newId(),mode,size:r.size,boxH:r.boxH,boxW:r.boxW,puzzle:r.puzzle,solution:r.solution,clues:r.clues,technique:r.technique,moves:[],undo:[],redo:[],elapsed:0,status:'active',lives:0,attempt:1,createdAt:Date.now(),updatedAt:Date.now()};
    S.games[g.id]=g;persist(g,true);openGame(g);
  },40);
}
function restartGame(){
  const o=S.g;o.status='restarted';o.finishedAt=Date.now();persist(o,true);
  const g=Object.assign({},o,{id:newId(),moves:[],undo:[],redo:[],elapsed:0,status:'active',lives:0,attempt:(o.attempt||1)+1,createdAt:Date.now(),updatedAt:Date.now()});
  delete g.finishedAt;
  S.games[g.id]=g;persist(g,true);hideOverlay();openGame(g);
}
function openGame(g){
  if(g.status!=='active'){openReview(g);return;}
  S.g=g;S.b=stateAt(g,g.moves.length);S.sel=new Set();S.primary=-1;S.notes=false;S.paused=false;S.zoom=false;S.lastTick=Date.now();
  const first=S.b.v.findIndex(x=>!x);if(first>=0){S.sel.add(first);S.primary=first;}
  renderGame();
  if(mistakes(g)>=limit(g))outOfLives();
}
function pushMove(a,d,cs,ch,extra){
  const g=S.g;if(!ch.length&&a!=='l')return false;
  g.moves.push(Object.assign({t:Math.round(g.elapsed),a,d,c:cs,ch},extra||{}));
  if(a==='p'||a==='n'||a==='x'||a==='k'){g.undo.push(g.moves.length-1);g.redo=[];}
  persist(g);return true;
}
const canWrite=c=>!S.g.puzzle[c]&&S.b.v[c]!==S.g.solution[c];
function placeOrNote(d){
  if(S.paused||!S.g)return;
  const b=S.b,g=S.g,ch=[];
  if(S.notes){
    const tg=[...S.sel].filter(c=>!g.puzzle[c]&&!b.v[c]);if(!tg.length)return;
    const bit=1<<(d-1),add=tg.some(c=>!(b.n[c]&bit));
    tg.forEach(c=>{const nv=add?b.n[c]|bit:b.n[c]&~bit;if(nv!==b.n[c])ch.push([c,1,b.n[c],nv]);});
    if(!ch.length)return;
    applyCh(b,ch);pushMove('n',d,tg,ch,{add:add?1:0});paintGame();return;
  }
  const c=S.primary;if(c<0)return;
  if(g.puzzle[c]){toast('That number is part of the puzzle.');return;}
  if(b.v[c]===g.solution[c])return;
  if(b.v[c]===d){ch.push([c,0,d,0]);applyCh(b,ch);pushMove('x',d,[c],ch);paintGame();return;}
  const right=d===g.solution[c];
  ch.push([c,0,b.v[c],d]);
  if(right){
    if(b.n[c])ch.push([c,1,b.n[c],0]);
    if(S.settings.autoNotes){const bit=1<<(d-1);E.geo(g.size,g.boxH,g.boxW).peers[c].forEach(p=>{if(b.n[p]&bit)ch.push([p,1,b.n[p],b.n[p]&~bit]);});}
  }
  applyCh(b,ch);pushMove('p',d,[c],ch);
  if(right&&b.v.every((x,i)=>x===g.solution[i])){finishGame();return;}
  paintGame();
  if(!right&&mistakes(g)>=limit(g))outOfLives();
}
function eraseSel(){
  if(S.paused)return;const b=S.b,g=S.g,cells=[...S.sel],ch=[];
  cells.forEach(c=>{
    if(canWrite(c)&&b.v[c])ch.push([c,0,b.v[c],0]);
    else if(!g.puzzle[c]&&!b.v[c]&&b.n[c])ch.push([c,1,b.n[c],0]);
    else if(b.k[c])ch.push([c,2,b.k[c],0]);});
  if(!ch.length)return;applyCh(b,ch);pushMove('x',0,cells,ch);paintGame();
}
function colourSel(k){
  if(S.paused)return;const b=S.b,cells=[...S.sel];if(!cells.length){toast('Pick a cell first.');return;}
  const to=k&&cells.every(c=>b.k[c]===k)?0:k,ch=[];
  cells.forEach(c=>{if(b.k[c]!==to)ch.push([c,2,b.k[c],to]);});
  if(!ch.length)return;applyCh(b,ch);pushMove('k',to,cells,ch);paintGame();
}
function undo(){const g=S.g;if(S.paused||!g.undo.length)return;const i=g.undo.pop(),m=g.moves[i];
  const rev=[];for(let j=m.ch.length-1;j>=0;j--){const x=m.ch[j];rev.push([x[0],x[1],x[3],x[2]]);}
  applyCh(S.b,rev);g.redo.push(i);pushMove('u',0,m.c,rev,{of:i});paintGame();}
function redo(){const g=S.g;if(S.paused||!g.redo.length)return;const i=g.redo.pop(),m=g.moves[i];
  applyCh(S.b,m.ch);g.undo.push(i);pushMove('r',0,m.c,m.ch.slice(),{of:i});
  if(S.b.v.every((x,j)=>x===g.solution[j])){finishGame();return;}paintGame();}
function outOfLives(){
  const g=S.g,n=mistakes(g);
  showOverlay('<div class="dialog" role="dialog" aria-label="Out of lives"><h2>'+plural(n,'mistake')+'</h2><p>You have used all your lives on this puzzle. What would you like to do?</p><div class="btns"><button class="btn main" data-act="life">Get another life (−15% score)</button><button class="btn" data-act="restart-yes">Restart this puzzle (−10% score)</button><button class="btn" data-act="end">End game</button></div></div>');
}
function finishGame(){
  const g=S.g;g.status='won';g.finishedAt=Date.now();persist(g,true);S.paused=false;S.sel=new Set();S.primary=-1;paintGame();
  const m=g.mode,w=wins(m),i=LEVELS.indexOf(m),r=scoreOf(g);
  let msg='',next='';
  if(i>=0){
    msg=w<=3?META[m].name+' stamp '+w+' of 3.':META[m].name+' stamp number '+w+'.';
    if(w===3&&i<5)msg+=' <b>'+META[LEVELS[i+1]].name+' is now open.</b>';
    if(i<5&&unlocked(i+1))next='<button class="btn" data-act="new" data-mode="'+LEVELS[i+1]+'">Play '+META[LEVELS[i+1]].name+'</button>';
  }
  showOverlay('<div class="dialog" role="dialog" aria-label="Puzzle solved"><div class="bigstamp" aria-hidden="true">✓</div><h2>Solved in '+fmt(g.elapsed)+'</h2><div class="scoreline">'+r.score.toLocaleString('en-GB')+'</div><p>'+breakdown(r)+'</p><div class="note">'+pctNote(g)+'</div>'+(msg?'<p>'+msg+'</p>':'')+'<p>Running score: <b>'+totalScore().toLocaleString('en-GB')+'</b></p><div class="btns"><button class="btn main" data-act="new" data-mode="'+m+'">Another '+META[m].name+'</button>'+next+'<button class="btn" data-act="review-cur">Replay this game</button><button class="btn" data-act="home">Back to levels</button></div></div>');
}
function breakdown(r){
  const bits=['Speed ×'+r.speed.toFixed(2)+' on '+r.base+' points'];
  if(r.mist)bits.push(plural(r.mist,'mistake')+' −'+Math.round(15*r.mist)+'%');
  if(r.lives)bits.push(plural(r.lives,'extra life').replace('lifes','lives')+' −'+Math.round(15*r.lives)+'%');
  if(r.rest)bits.push(plural(r.rest,'restart')+' −'+Math.round(10*r.rest)+'%');
  return bits.join(' · ');
}
function pctNote(g){return'Faster than about <b>'+fasterThan(g)+'%</b> of players on a '+META[g.mode].name+' puzzle like this one (estimate).';}
function showOverlay(html,sheet){const o=$('#overlay');o.className='over'+(sheet?' osheet':'');o.innerHTML=html;o.hidden=false;}
function hideOverlay(){const o=$('#overlay');o.hidden=true;o.innerHTML='';S.lastTick=Date.now();}
let toastT;function toast(t){const x=$('#toast');x.textContent=t;x.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{x.hidden=true;},2600);}

/* ---------- board drawing ---------- */
function buildBoard(el,g,ro){
  const N=g.size;el.style.setProperty('--n',N);
  el.style.setProperty('--nc',N===16?4:3);
  el.className='board'+(ro?' ro':'');el.setAttribute('role','grid');
  let h='';
  for(let i=0;i<N*N;i++){const r=Math.floor(i/N),c=i%N;
    let cl='cell';
    if(c===N-1)cl+=' er';else if((c+1)%g.boxW===0)cl+=' br';
    if(r===N-1)cl+=' eb';else if((r+1)%g.boxH===0)cl+=' bb';
    h+='<div class="'+cl+'" data-c="'+i+'" data-base="'+cl+'" role="gridcell"></div>';}
  el.innerHTML=h;
  return[...el.children];
}
function notesHtml(mask,N,hit){
  let s='<div class="notes">';
  for(let d=1;d<=N;d++){const on=mask&(1<<(d-1));s+='<b'+(on&&d===hit?' class="hit"':'')+'>'+(on?sym(d):'')+'</b>';}
  return s+'</div>';
}
function paint(cells,g,b,o){
  const N=g.size,geo=E.geo(N,g.boxH,g.boxW),pv=o.primary>=0?b.v[o.primary]:0;
  const peer=new Set();if(o.primary>=0)geo.peers[o.primary].forEach(x=>peer.add(x));
  cells.forEach((el,i)=>{
    const v=b.v[i];let cl=el.dataset.base;
    if(b.k[i])cl+=' k'+b.k[i];
    if(o.sel&&o.sel.has(i))cl+=i===o.primary?' primary':' sel';
    else if(pv&&v===pv)cl+=' same';
    else if(peer.has(i))cl+=' peer';
    if(v&&v!==g.solution[i])cl+=' wrong';
    if(o.touched&&o.touched.has(i))cl+=' touched';
    let inner='';
    if(v)inner='<span class="'+(g.puzzle[i]?'v-given':'v-user')+'">'+sym(v)+'</span>';
    else if(o.solution)inner='<span class="v-sol">'+sym(g.solution[i])+'</span>';
    else if(b.n[i])inner=notesHtml(b.n[i],N,pv);
    if(el.className!==cl)el.className=cl;
    if(el._h!==inner){el.innerHTML=inner;el._h=inner;}
    const lab=rc(i,N)+(v?', '+sym(v):', empty');if(el._l!==lab){el.setAttribute('aria-label',lab);el._l=lab;}
  });
}

const fmtC=ms=>{const s=Math.floor((ms||0)/1000),h=Math.floor(s/3600),m=Math.floor(s/60)%60,x=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+x:String(m).padStart(2,'0')+':'+x;};
function liveScore(g,b){
  let tot=0,done=0;g.puzzle.forEach((p,i)=>{if(!p){tot++;if(b.v[i]===g.solution[i])done++;}});
  const r=scoreOf(g);return tot?Math.round(r.base*r.speed*r.mult*done/tot):0;
}
function renderGame(){

function where(c,N){return c.length===1?rc(c[0],N):c.length+' cells';}
function describe(g,m){

  switch(m.a){
    case'p':{const bad=wrongPlace(g,m);return{t:'Placed '+sym(m.d)+' in '+where(m.c,N)+(aux?', cleared '+plural(aux,'note'):'')+(bad?'. Mistake.':''),bad};}
    case'n':return{t:(m.add?'Note '+sym(m.d)+' added in ':'Note '+sym(m.d)+' removed from ')+where(m.c,N)};
    case'x':return{t:'Erased '+where(m.c,N)};
    case'k':return{t:m.d?'Coloured '+where(m.c,N)+' '+COLOURS[m.d-1]:'Removed colour from '+where(m.c,N)};
    case'c':return{t:m.d?'Checked the board: '+m.d+' wrong':'Checked the board: all correct'};
    case'l':return{t:'Took another life'};
    case'u':return{t:'Undid: '+describe(g,g.moves[m.of]).t};

/* ---------- scores ---------- */
function drawLine(el,pts,opts){
  if(pts.length<2){el.innerHTML='<div class="empty" style="padding:18px 0">Win 2 games to draw this.</div>';return;}
  const W=520,H=190,L=46,R=14,T=12,B=26;
  const maxY=Math.max(...pts.map(p=>p.y)),hi=niceMax(opts.floor?Math.max(maxY,opts.floor):maxY);
  const x=i=>L+(W-L-R)*i/(pts.length-1),y=v=>H-B-(H-B-T)*v/hi;
  const ticks=[0,hi/2,hi];
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+opts.label+'">';
  ticks.forEach(t=>{s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)" stroke-width="1"/><text class="axis" x="'+(L-6)+'" y="'+(y(t)+4)+'" text-anchor="end">'+opts.fmt(t)+'</text>';});
  const xt=[0,pts.length-1];xt.forEach(i=>{s+='<text class="axis" x="'+x(i)+'" y="'+(H-8)+'" text-anchor="'+(i?'end':'start')+'">Win '+(i+1)+'</text>';});
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.y).toFixed(1)).join(' ');
  s+='<path d="'+path+' L'+x(pts.length-1).toFixed(1)+' '+y(0)+' L'+x(0)+' '+y(0)+' Z" fill="var(--area)"/><path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  const lp=pts[pts.length-1];
  s+='<circle cx="'+x(pts.length-1)+'" cy="'+y(lp.y)+'" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><g class="hv" hidden><line class="hl" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--ink3)" stroke-width="1"/><circle class="hd" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/></g></svg>';
  el.innerHTML=s;
  const svg=el.querySelector('svg'),hv=svg.querySelector('.hv'),tip=document.createElement('div');tip.className='tip';tip.hidden=true;el.appendChild(tip);
  const move=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(pts.length-1,Math.round((px-L)/(W-L-R)*(pts.length-1))));
    hv.hidden=false;hv.querySelector('.hl').setAttribute('x1',x(i));hv.querySelector('.hl').setAttribute('x2',x(i));hv.querySelector('.hd').setAttribute('cx',x(i));hv.querySelector('.hd').setAttribute('cy',y(pts[i].y));
    tip.hidden=false;tip.textContent=pts[i].tip;
    const er=el.getBoundingClientRect(),tx=x(i)/W*r.width+(r.left-er.left);
    tip.style.top=(r.top-er.top)+'px';
    if(tx>er.width/2){tip.style.left='auto';tip.style.right=(er.width-tx+6)+'px';}else{tip.style.right='auto';tip.style.left=(tx+6)+'px';}};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>{hv.hidden=true;tip.hidden=true;});
}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return(n<=1?1:n<=2?2:n<=4?4:n<=5?5:10)*p;}
function renderScores(){
  S.view='scores';navCur('scores');setIngame(false);stopPlay();
  const w=wonGames();
  let h='<div class="home"><section class="card scoretop" aria-label="Running score"><div><div class="label">Running score</div><div class="bignum">'+totalScore().toLocaleString('en-GB')+'</div></div><div><p class="lede" style="margin:0">'+paceLine()+'</p><p class="lede" style="margin:2px 0 0">'+plural(w.length,'win')+' so far.</p></div></section>';
  h+='<section class="charts"><div class="card chartc"><h2>Running score</h2><div id="ch1" style="position:relative"></div></div><div class="card chartc"><h2>Speed per win</h2><div class="foot">1.0× is a typical player’s pace for that puzzle.</div><div id="ch2" style="position:relative"></div></div></section>';
  h+='<section class="card tbl" tabindex="0" aria-label="Scores by level"><table><thead><tr><th>Level</th><th>Wins</th><th>Best score</th><th>Best time</th><th class="hidem">Avg time</th><th>Trend</th></tr></thead><tbody>';
  ALLMODES.forEach(m=>{const g=wonGames(m);
    if(!g.length){h+='<tr><td>'+META[m].name+'</td><td>0</td><td>–</td><td>–</td><td class="hidem">–</td><td>–</td></tr>';return;}
    const bs=Math.max(...g.map(x=>scoreOf(x).score)),bt=Math.min(...g.map(x=>x.elapsed)),av=g.reduce((a,x)=>a+x.elapsed,0)/g.length;
    let tr='–';
    if(g.length>=2){const n=Math.floor(g.length/2),a=z=>z.reduce((s,x)=>s+Math.log(speedOf(x)),0)/z.length,r=Math.exp(a(g.slice(-n))-a(g.slice(0,n))),p=Math.round(Math.abs(r-1)*100);tr=p<1?'Same':p+'% '+(r>1?'faster':'slower');}
    h+='<tr><td>'+META[m].name+'</td><td>'+g.length+'</td><td>'+bs.toLocaleString('en-GB')+'</td><td>'+fmt(bt)+'</td><td class="hidem">'+fmt(av)+'</td><td>'+tr+'</td></tr>';});
  h+='</tbody></table></section><section class="foot"><p style="margin:0 0 6px"><b>How the score works.</b> Each level has base points. Your speed against a typical player’s time for that puzzle multiplies them, from ×0.3 up to ×3. Each mistake takes off 15%, each extra life another 15%, and each restart 10%.</p><p style="margin:0"><b>How “faster than x%” works.</b> It is an estimate, because no one else has played your puzzle and no public data gives percentiles by level. Typical times are set per level and adjusted for the techniques your exact puzzle needs, then compared with a spread of solve times. Real data informs the scale: about 23 minutes on average for the general public and about 8 for expert solvers (Pelánek, 2014). The per-level times, the spread, and the Fast and 16×16 figures are my own calibration.</p></section></div>';
  view.innerHTML=h;
  let run=0;
  drawLine($('#ch1'),w.map((g,i)=>{const sc=scoreOf(g).score;run+=sc;return{y:run,tip:META[g.mode].name+' +'+sc+' · total '+run};}),{label:'Running score over your wins',fmt:v=>Math.round(v).toLocaleString('en-GB')});
  drawLine($('#ch2'),w.map(g=>({y:speedOf(g),tip:META[g.mode].name+' '+fmt(g.elapsed)+' · ×'+speedOf(g).toFixed(2)})),{label:'Speed against a typical player per win',fmt:v=>'×'+(+v.toFixed(1)),floor:1});
}

function dateStr(t){const d=new Date(t);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}

function rvGo(step){

  'rv-step'(el){stopPlay();rvGo(S.rv.step+ +el.dataset.d);},
  'rv-play'(){togglePlay();},
  'rv-sol'(el){S.rv.sol=!S.rv.sol;el.textContent=S.rv.sol?'Hide solution':'Show solution';rvGo(S.rv.step);}
};
function endAs(st){const g=S.g;g.status=st;g.finishedAt=Date.now();persist(g,true);S.g=null;openReview(g);}
document.addEventListener('click',e=>{
  if(e.target.id==='overlay'&&e.target.classList.contains('osheet')){hideOverlay();return;}
  const el=e.target.closest('[data-act]');
  if(el){const f=ACT[el.dataset.act];if(f)f(el);return;}
  if(S.view==='game'&&S.zoom&&!S.paused){const c=e.target.closest('#board .cell');if(c){const i=+c.dataset.c;S.sel=new Set([i]);S.primary=i;paintGame();}}
});
document.addEventListener('change',e=>{if(e.target.id==='o-auto'){S.settings.autoNotes=e.target.checked;saveSettings();}if(e.target.id==='o-import'&&e.target.files[0])restoreBackup(e.target.files[0]);});
window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();if(S.view==='scores')renderScores();});
function cellAt(e){const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest&&el.closest('#board .cell');return c?+c.dataset.c:-1;}
document.addEventListener('pointerdown',e=>{
  if(S.view!=='game'||S.paused||S.zoom)return;const c=e.target.closest&&e.target.closest('#board .cell');if(!c)return;
  const i=+c.dataset.c;
  if(e.ctrlKey||e.metaKey||e.shiftKey){if(S.sel.has(i)&&S.sel.size>1)S.sel.delete(i);else S.sel.add(i);S.primary=i;}
  else{S.sel=new Set([i]);S.primary=i;S.dragging=true;}
  try{if(e.target.hasPointerCapture&&e.target.hasPointerCapture(e.pointerId))e.target.releasePointerCapture(e.pointerId);}catch(x){}
  $('#board').focus({preventScroll:true});
  paintGame();
});
document.addEventListener('pointermove',e=>{
  if(!S.dragging||S.view!=='game')return;const i=cellAt(e);
  if(i>=0&&!S.sel.has(i)){S.sel.add(i);paintGame();}
});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{S.dragging=false;}));
document.addEventListener('keydown',e=>{
  if(S.view==='review'){if(e.target.id==='rv-range')return;
    if(e.key==='ArrowLeft'){stopPlay();rvGo(S.rv.step-1);e.preventDefault();}
    if(e.key==='ArrowRight'){stopPlay();rvGo(S.rv.step+1);e.preventDefault();}return;}
  if(S.view!=='game'||!S.g||!$('#overlay').hidden)return;
  if(e.target.tagName==='INPUT')return;
  const N=S.g.size,k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==='y'){e.preventDefault();redo();return;}
  if(mod)return;
  if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k)){e.preventDefault();let p=S.primary<0?0:S.primary;
    const r=Math.floor(p/N),c=p%N;
    p=k==='arrowup'?((r+N-1)%N)*N+c:k==='arrowdown'?((r+1)%N)*N+c:k==='arrowleft'?r*N+(c+N-1)%N:r*N+(c+1)%N;
    if(e.shiftKey)S.sel.add(p);else S.sel=new Set([p]);S.primary=p;paintGame();return;}
  if(k==='backspace'||k==='delete'||k==='0'){e.preventDefault();eraseSel();return;}
  if(k==='n'||(k===' '&&e.target.tagName!=='BUTTON')){e.preventDefault();S.notes=!S.notes;paintGame();return;}
  let d=0;
  const code=e.code||'';
  if(/^Digit[1-9]$/.test(code))d=+code[5];else if(/^Numpad[1-9]$/.test(code))d=+code[6];
  else if(/^[1-9]$/.test(k))d=+k;
  else if(N===16&&/^[a-g]$/.test(k))d=10+k.charCodeAt(0)-97;
  if(d&&d<=N){e.preventDefault();
    if(e.shiftKey&&!S.notes){S.notes=true;placeOrNote(d);S.notes=false;paintGame();}else placeOrNote(d);}
});
function refreshView(){
  if(!$('#overlay').hidden&&S.view==='game')return;
  if(S.view==='home')renderHome();
  else if(S.view==='hist')renderHistory();
  else if(S.view==='scores')renderScores();
  else if(S.view==='game'&&S.g){if(S.g.status==='active')renderGame();else{const g=S.g;S.g=null;openReview(g);}}
}
lsLoad();
applyTheme();
renderHome();
initCloud();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
